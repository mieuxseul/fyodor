name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build artifacts without creating a GitHub Release"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  windows:
    name: Windows NSIS
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm ci

      - name: Build Kotatsu bridge jar
        working-directory: sidecars/kotatsu-bridge
        shell: pwsh
        run: |
          .\gradlew.bat shadowJar --no-daemon
          New-Item -ItemType Directory -Force -Path ..\..\src-tauri\resources | Out-Null
          Copy-Item .\build\libs\kotatsu-bridge.jar ..\..\src-tauri\resources\kotatsu-bridge.jar -Force

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Configure signing
        id: signing
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if ($env:TAURI_SIGNING_PRIVATE_KEY) {
            echo "enabled=true" >> $env:GITHUB_OUTPUT
          } else {
            echo "enabled=false" >> $env:GITHUB_OUTPUT
            Write-Warning "TAURI_SIGNING_PRIVATE_KEY missing — building unsigned NSIS (updater artifacts off)."
            $confPath = "src-tauri/tauri.conf.json"
            $raw = Get-Content $confPath -Raw
            $raw = $raw -replace '"createUpdaterArtifacts"\s*:\s*true', '"createUpdaterArtifacts": false'
            Set-Content -Path $confPath -Value $raw -NoNewline
          }

      - name: Build installer
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri:build

      - name: Make latest.json
        if: steps.signing.outputs.enabled == 'true'
        run: node ./scripts/make-latest-json.mjs

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fyodor-windows
          path: |
            src-tauri/target/release/bundle/nsis/*
            release/latest.json
          if-no-files-found: warn

      - name: Publish GitHub Release
        if: ${{ startsWith(github.ref, 'refs/tags/') && github.event_name == 'push' }}
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/nsis/*-setup.exe.sig
            release/latest.json
          generate_release_notes: true
          fail_on_unmatched_files: false
