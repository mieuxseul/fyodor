name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build artifacts without creating a GitHub Release"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  windows:
    name: Windows NSIS
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # kotatsu-parsers buildSrc + bridge toolchain both require JDK 17.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: npm ci

      # Parsers are gitignored locally; CI clones + publishes them for the bridge shadowJar.
      - name: Checkout kotatsu-parsers-redo
        uses: actions/checkout@v4
        with:
          repository: Kotatsu-Redo/kotatsu-parsers-redo
          path: sidecars/kotatsu-parsers-redo

      - name: Publish parsers to mavenLocal
        working-directory: sidecars/kotatsu-parsers-redo
        shell: pwsh
        run: |
          Write-Host "JAVA_HOME=$env:JAVA_HOME"
          java -version
          .\gradlew.bat publishToMavenLocal --no-daemon

      - name: Build Kotatsu bridge jar
        working-directory: sidecars/kotatsu-bridge
        shell: pwsh
        run: |
          .\gradlew.bat shadowJar --no-daemon --stacktrace --info 2>&1 | Tee-Object -FilePath bridge-build.log
          if ($LASTEXITCODE -ne 0) {
            Write-Host "==== Kotlin/Gradle errors ===="
            Select-String -Path bridge-build.log -Pattern 'e: |error:|Conflicting|FAILED|What went wrong' | ForEach-Object { $_.Line }
            exit $LASTEXITCODE
          }
          New-Item -ItemType Directory -Force -Path ..\..\src-tauri\resources | Out-Null
          Copy-Item .\build\libs\kotatsu-bridge.jar ..\..\src-tauri\resources\kotatsu-bridge.jar -Force
          $jar = Get-Item ..\..\src-tauri\resources\kotatsu-bridge.jar
          if ($jar.Length -lt 1MB) {
            throw "kotatsu-bridge.jar looks too small ($($jar.Length) bytes)"
          }
          Write-Host "Bundled Kotatsu bridge: $($jar.FullName) ($([math]::Round($jar.Length/1MB, 1)) MB)"

      # Portable JRE so Other sources work with zero Java setup on user PCs.
      - name: Bundle portable Temurin JRE 17
        shell: pwsh
        run: |
          $out = "src-tauri\resources\jre"
          $zip = Join-Path $env:RUNNER_TEMP "temurin-jre17.zip"
          $extract = Join-Path $env:RUNNER_TEMP "temurin-jre17"
          $url = "https://api.adoptium.net/v3/binary/latest/17/ga/windows/x64/jre/hotspot/normal/eclipse?project=jdk"
          Write-Host "Downloading Temurin JRE 17…"
          Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing
          if (Test-Path $extract) { Remove-Item -Recurse -Force $extract }
          Expand-Archive -Path $zip -DestinationPath $extract -Force
          $root = Get-ChildItem $extract | Where-Object { $_.PSIsContainer } | Select-Object -First 1
          if (-not $root) { throw "Temurin zip had no top-level directory" }
          if (Test-Path $out) { Remove-Item -Recurse -Force $out }
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item -Path (Join-Path $root.FullName "*") -Destination $out -Recurse -Force
          $java = Join-Path $out "bin\java.exe"
          if (-not (Test-Path $java)) { throw "Bundled JRE missing bin\java.exe" }
          $javaItem = Get-Item $java
          if ($javaItem.Length -lt 8KB) { throw "Bundled java.exe looks too small ($($javaItem.Length) bytes)" }
          & $java -version
          $sizeMb = [math]::Round(((Get-ChildItem $out -Recurse -File | Measure-Object Length -Sum).Sum) / 1MB, 1)
          Write-Host "Bundled portable JRE at $out ($sizeMb MB)"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Configure signing
        id: signing
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if ($env:TAURI_SIGNING_PRIVATE_KEY) {
            echo "enabled=true" >> $env:GITHUB_OUTPUT
          } else {
            echo "enabled=false" >> $env:GITHUB_OUTPUT
            Write-Warning "TAURI_SIGNING_PRIVATE_KEY missing — building unsigned NSIS (updater artifacts off)."
            $confPath = "src-tauri/tauri.conf.json"
            $raw = Get-Content $confPath -Raw
            $raw = $raw -replace '"createUpdaterArtifacts"\s*:\s*true', '"createUpdaterArtifacts": false'
            Set-Content -Path $confPath -Value $raw -NoNewline
          }

      - name: Build installer
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri:build

      - name: Make latest.json
        if: steps.signing.outputs.enabled == 'true'
        run: node ./scripts/make-latest-json.mjs

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fyodor-windows
          path: |
            src-tauri/target/release/bundle/nsis/*
            release/latest.json
          if-no-files-found: warn

      - name: Publish GitHub Release
        if: ${{ startsWith(github.ref, 'refs/tags/') && github.event_name == 'push' }}
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/nsis/*-setup.exe.sig
            release/latest.json
          generate_release_notes: true
          fail_on_unmatched_files: false
